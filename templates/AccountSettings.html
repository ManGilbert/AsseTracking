{% extends 'base.html' %}

{% block title %}Account Settings{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h3 mb-0"><i class="feather-settings me-2"></i>Account Settings</h1>
            <p class="text-muted mb-0">Change your username, email, or password.</p>
        </div>
    </div>
    <div class="card">
        <form method="post" class="card-body">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input class="form-control" name="username" value="{{ request.user.username }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email" value="{{ request.user.email }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Current Password</label>
                    <input class="form-control" type="password" name="current_password" autocomplete="current-password">
                </div>
                <div class="col-md-4">
                    <label class="form-label">New Password</label>
                    <input class="form-control" type="password" name="new_password" autocomplete="new-password">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Confirm New Password</label>
                    <input class="form-control" type="password" name="confirm_password" autocomplete="new-password">
                </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-primary" type="submit">Save Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
